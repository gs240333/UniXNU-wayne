schema_version = 2

[board]
name = "wayne"
soc = "SDM660"
soc_source = "sdm660"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi MI 6X"
kit = "wayne"

#
# Stage 1 selection: no native storage driver yet. RamBlock publishes a RAM-backed
# block device so the kernel can reach userspace without an eMMC driver, and the
# firmware's GOP (ABL splash buffer) is handed to XNU through GopFramebuffer.
#
[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "RamBlock", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "wayne_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sdm660.config", "os:configs/ipados.config"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:RamBlock",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/wayne.dts"

[firmware]
config = "wayne"
dsc = "Platforms/Xiaomi/waynePkg/wayne.dsc"
fd = "Build/waynePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Mu_Basecore", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
DEVICE_MODEL = "wayne"

[bootimg.image]
header_version = 0
base = 0x10000000
kernel_offset = 0x00008000
ramdisk_offset = 0x01000000
tags_offset = 0x00000100
pagesize = 4096

[payload]
volume = "WAYNEESP"
size_mib = 56
loader = "firmware"
title = "UniXNU"
dram_size = "0x80000000"
# Copied from the reference SDM660 port (UniXNU-clover): the same SoC, the same
# eMMC, the same 2 GiB low bank. armcpu-timer-intid=19 is the SDM660 arch timer
# PPI; boot-progress=2 and the offline-legacy-* set enable the patched boot path.
panic_screen = false
entry_probe_reset_delay = 10
entry_probe_reset_after = "_PE_create_console"
entry_probe_reset_before = true
entry_probe_reset_in = "_arm_init"
entry_probe_reset_occurrence = 1
kernel_args = [
  "-v",
  "kt_fixed_zones=120",
  "boot-progress=2",
  "allow_legacy_mach_msg=1",
  "armcpu-timer-intid=19",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "cs_enforcement_disable=1",
  "offline-mobile-graphics-load=1",
  "offline-legacy-register=1",
  "offline-legacy-phase=4",
  "offline-legacy-gop=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-retire=1",
  "panic_on_crash_disabled=1",
]

[payload.adt]
chip_id = "0x13d"
owned_memory_size = "0x40000000"
unique_chip_id = "required"

[userdata]
first_lba = 14417920
last_lba = 122142686
lba_bytes = 512
windows = [{ name = "OS", component = "OS" }, { name = "SystemOS", component = "Cryptex1,SystemOS" }]
