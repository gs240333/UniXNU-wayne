name: Build kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'board.toml'
      - 'configs/**'
      - 'feeds.toml'
      - 'drivers/**'
      - 'dts/**'
      - 'patches/**'
      - 'package/**'
      - '.github/workflows/kernel.yml'

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DEFCONFIG: wayne_defconfig
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive

      - name: Check out this device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Check out the SDM660 SoC repository
        uses: actions/checkout@v4
        with:
          repository: gs240333/UniXNU-sdm660-common
          path: UniXNU-sdm660-common

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc unifdef
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          for tool in git make clang cmake ninja unifdef ld.lld dtc xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Select the device and fetch sources
        working-directory: UniXNU
        run: |
          cat > ../device/local.toml <<'EOF'
          [[source]]
          kind = "soc"
          name = "sdm660"
          local = "../UniXNU-sdm660-common"
          EOF
          chmod +x unixnu
          ./unixnu defconfig "$DEFCONFIG" -D ../device
          ./unixnu fetch -D ../device
          ./unixnu status --json -D ../device | tee /tmp/status.json

      - name: Assemble the build tree
        working-directory: UniXNU
        run: ./unixnu tree -D ../device

      # The PMGR and storage archives audit the board's own prelinked kernel, so
      # the first pass builds one without them and the second pass turns them
      # on. This is the round 1 / round 2 shape the reference board documents.
      - name: Seed the prelink reference
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp ../device/board.toml /tmp/board.toml.keep
          cp ../device/configs/wayne_defconfig /tmp/wayne_defconfig.keep
          python3 - <<'PY'
          import re
          from pathlib import Path
          b = Path('../device/board.toml')
          text = b.read_text()
          for line in ('  "build-clover-pmgr.py",\n',
                       '  "build-wayne-driver.py CloverSdhci --out clover-sdhci",\n',
                       '  "build-clover-block.py",\n'):
              text = text.replace(line, '')
          b.write_text(text)
          d = Path('../device/configs/wayne_defconfig')
          t = d.read_text().replace('CONFIG_XNU_SHENG_PMGR=y', 'CONFIG_XNU_SHENG_PMGR=n')
          # The owner mount makes the kernel reference the block-stack contract, so
          # this pass still links the weak stubs archive; everything that audits the
          # prelinked kernel stays out.
          t = re.sub(r'^CONFIG_XNU_EXTRA_LD_ARCHIVES=.*$',
                     'CONFIG_XNU_EXTRA_LD_ARCHIVES="{tree}/build/wayne-board-stubs/libWayneBoardStubs.a"',
                     t, flags=re.M)
          d.write_text(t)
          PY
          ./unixnu defconfig "$DEFCONFIG" -D ../device
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" ./unixnu build kernel -D ../device
          cp /tmp/board.toml.keep ../device/board.toml
          cp /tmp/wayne_defconfig.keep ../device/configs/wayne_defconfig
          ./unixnu defconfig "$DEFCONFIG" -D ../device
          OUT=$(python3 -c "import json;print(json.load(open('/tmp/status.json'))['output'])")
          ls -l "$OUT/kernel/kernel.macho"

      - name: Build the kernel
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" ./unixnu build kernel -D ../device

      - name: Fetch the firmware volume
        run: |
          mkdir -p fw
          curl -fsSL -o fw/SILICIUM_UEFI.fd \
            https://github.com/gs240333/Mu-Silicium/releases/download/wayne-latest/SILICIUM_UEFI.fd
          ls -l fw/SILICIUM_UEFI.fd
          git clone --depth 1 -q https://github.com/gs240333/Mu-Silicium.git mu-wayne
          ls mu-wayne/Resources/Configs/wayne.toml

      # The launchd image is in the trust cache; without a bundle the exec of
      # /sbin/launchd fails with ENOEXEC and the sealed SystemOS volume refuses
      # its mount. build-original-system-trust.py bundles the two unchanged
      # Apple modules from the target IPSW, and --owner-trust-cache is the input
      # that carries them without the board allow-list.
      - name: Restore the target IPSW
        uses: actions/cache@v4
        with:
          path: UniXNU/refer
          key: wayne-ipsw-ipad-17.7.11-21H461

      - name: Build the original trust bundle
        working-directory: UniXNU
        run: |
          mkdir -p refer
          if [ ! -f refer/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw ]; then
            curl -fL --retry 3 -o refer/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw \
              https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
          fi
          ls -l refer/
          # The bundle builder wants the target's static trust cache staged where
          # the reference tree keeps it.
          STATIC=$(./unixnu ipsw fetch StaticTrustCache -D ../device | tail -1)
          echo "static trust cache: $STATIC"
          mkdir -p .cache/firmware/target-volumes
          cp "$STATIC" .cache/firmware/target-volumes/static-trustcache.bin
          shasum -a 256 .cache/firmware/target-volumes/static-trustcache.bin
          ls -l .cache/firmware/target-volumes/
          python3 scripts/build-original-system-trust.py
          ls -l build/original-static-system-trust/

      # --uefi is needed here as well: the entry probe and panic screen take their
      # font from Mu-Silicium's FrameBufferSerialPortLib.
      - name: Build the payload
        working-directory: UniXNU
        run: |
          ./unixnu build payload -D ../device --uefi ../mu-wayne --unique-chip-id 0x3b61b8fa \
            --owner-trust-cache build/original-static-system-trust/original-static-system.bundle
          OUT=$(python3 -c "import json;print(json.load(open('/tmp/status.json'))['output'])")
          ls -l "$OUT/payload"

      - name: Pack the boot image
        working-directory: UniXNU
        run: |
          OUT=$(python3 -c "import json;print(json.load(open('/tmp/status.json'))['output'])")
          ./unixnu bootimg -D ../device --uefi ../mu-wayne \
            --fd ../fw/SILICIUM_UEFI.fd \
            --dtb "$OUT/device-tree/hardware.dtb" \
            -o ../boot.img
          ls -l ../boot.img
          cp "$OUT/payload/payload.img" ../payload.img

      - name: Collect outputs
        if: always()
        run: |
          OUT=$(python3 -c "import json;print(json.load(open('/tmp/status.json'))['output'])")
          echo "output=$OUT" >> "$GITHUB_ENV"
          mkdir -p artifact
          cp -v "$OUT/kernel/kernel.macho" artifact/ 2>/dev/null || true
          cp -v boot.img artifact/ 2>/dev/null || true
          cp -v payload.img artifact/ 2>/dev/null || true
          cp -rv "$OUT/logs" artifact/logs 2>/dev/null || true
          ls -la artifact

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayne-kernel
          path: artifact/**
          if-no-files-found: warn
