name: Resolve configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: device

      - uses: actions/checkout@v4
        with:
          repository: gs240333/UniXNU-sdm660-common
          path: UniXNU-sdm660-common

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve profiles and components
        run: |
          cat > device/local.toml <<'EOF'
          [[source]]
          kind = "soc"
          name = "sdm660"
          local = "../UniXNU-sdm660-common"
          EOF
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig wayne_defconfig -D ../device
          ./unixnu status --json -D ../device | tee /tmp/status.json
          python3 -c "import json;d=json.load(open('/tmp/status.json'));print('device:',d.get('device'));print('output:',d.get('output'))"

      - uses: actions/upload-artifact@v4
        with:
          name: status
          path: /tmp/status.json
