name: Data seed

# The third SHNGROOT window is the writable Data volume. The reference board
# appends a 32 MiB APFS container after SystemOS and hands the owner mount its
# UUID; the generator behind it is not published, so this builds the same shape
# here and prints the volume UUID that has to go into CloverBlock.cpp.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the APFS Data volume
        run: |
          set -eux
          hdiutil create -size 32m -fs APFS -volname Data -type UDIF -ov /tmp/data.dmg
          hdiutil attach -readwrite -nobrowse -noautoopen -plist /tmp/data.dmg > /tmp/attach.plist
          python3 - <<'PY'
          import plistlib
          data = plistlib.load(open('/tmp/attach.plist', 'rb'))
          for entity in data.get('system-entities', []):
              if 'dev-entry' in entity:
                  print('dev:', entity['dev-entry'], 'mount:', entity.get('mount-point', ''))
          PY
          diskutil apfs list -plist > /tmp/apfs.plist
          python3 - <<'PY'
          import plistlib
          data = plistlib.load(open('/tmp/apfs.plist', 'rb'))
          for container in data.get('Containers', []):
              for volume in container.get('Volumes', []):
                  print('volume', volume.get('Name'), 'uuid',
                        volume.get('APFSVolumeUUID') or volume.get('VolumeUUID'))
          PY

      - name: Read the seed out of the attached device
        run: |
          set -eux
          DEV=$(python3 - <<'PY'
          import plistlib
          data = plistlib.load(open('/tmp/attach.plist', 'rb'))
          for entity in data.get('system-entities', []):
              if 'dev-entry' in entity:
                  print(entity['dev-entry'])
                  break
          PY
          )
          echo "device: $DEV"
          RAW=$(printf '%s' "$DEV" | sed 's#/dev/disk#/dev/rdisk#')
          dd if="$RAW" of="$GITHUB_WORKSPACE/data-seed.img" bs=1m count=32
          UUID=$(python3 - <<'PY'
          import plistlib
          data = plistlib.load(open('/tmp/apfs.plist', 'rb'))
          for container in data.get('Containers', []):
              for volume in container.get('Volumes', []):
                  if volume.get('Name') == 'Data':
                      print((volume.get('APFSVolumeUUID') or volume.get('VolumeUUID') or '').upper())
          PY
          )
          echo "DATA_UUID=$UUID" >> "$GITHUB_ENV"
          ls -l "$GITHUB_WORKSPACE/data-seed.img"
          hdiutil detach "$DEV"

      - name: Summary
        if: always()
        run: |
          echo "Data volume UUID: ${{ env.DATA_UUID }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum data-seed.img >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: wayne-data-seed
          path: data-seed.img
          if-no-files-found: error
