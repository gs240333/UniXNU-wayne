name: Data seed

# The third SHNGROOT window is the writable Data volume. The reference board
# appends a 32 MiB APFS container after SystemOS and hands the owner mount its
# UUID; the generator behind it is not published, so this builds the same shape
# here and prints the volume UUID that has to go into CloverBlock.cpp.
#
# The UUID is random per run, so always take the artifact and the UUID from the
# same run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Build the APFS Data volume and read it back
        run: |
          set -eux
          hdiutil create -size 32m -fs APFS -volname Data -type UDIF -ov /tmp/data.dmg
          hdiutil attach -readwrite -nobrowse -noautoopen -plist /tmp/data.dmg > /tmp/attach.plist
          DEV=$(python3 -c "import plistlib;d=plistlib.load(open('/tmp/attach.plist','rb'));print([e['dev-entry'] for e in d['system-entities'] if e.get('content-hint')=='Apple_APFS'][0])")
          DISK=$(python3 -c "import plistlib;d=plistlib.load(open('/tmp/attach.plist','rb'));print([e['dev-entry'] for e in d['system-entities'] if 'dev-entry' in e][0])")
          echo "container: $DEV disk: $DISK"
          diskutil apfs list "$DEV"
          UUID=$(diskutil apfs list -plist "$DEV" | python3 -c "
          import plistlib, sys
          data = plistlib.load(sys.stdin.buffer)
          for container in data.get('Containers', []):
              for volume in container.get('Volumes', []):
                  if volume.get('Name') == 'Data':
                      print((volume.get('APFSVolumeUUID') or volume.get('VolumeUUID') or '').upper())
          " | head -1)
          echo "DATA_UUID=$UUID"
          # The window must start with the APFS container superblock, so the seed
          # is the partition, not the disk image with its partition map.
          RAW=$(printf '%s' "$DEV" | sed 's#/dev/disk#/dev/rdisk#')
          dd if="$RAW" of="$GITHUB_WORKSPACE/data-seed.img" bs=4096
          hdiutil detach "$DISK"
          ls -l "$GITHUB_WORKSPACE/data-seed.img"
          echo "DATA_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          echo "Data volume UUID: ${{ env.DATA_UUID }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum data-seed.img >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: wayne-data-seed
          path: data-seed.img
          if-no-files-found: error
