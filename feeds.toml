#
# SDM660 platform support.
#
# There is no upstream UniXNU SoC repository for SDM660, so this board pins its
# own SoC repository. Update the commit when the SoC repository changes.
#
[[source]]
kind = "soc"
name = "sdm660"
git = "https://github.com/gs240333/UniXNU-sdm660-common.git"
commit = "ee7113a90c966635dbbd43111b2370a0ed3afc53"
# SDM660 ArmCpu: the base driver arms the arch timer with PPI 27, this SoC raises
# 19. The board copy takes the line from armcpu-timer-intid and changes nothing else.
[[source]]
kind = "driver"
name = "ArmCpu"
local = "drivers/ArmCpu"