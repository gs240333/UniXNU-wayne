#
# SDM660 platform support.
#
# There is no upstream UniXNU SoC repository for SDM660, so this board pins its
# own SoC repository. Update the commit when the SoC repository changes.
#
[[source]]
kind = "soc"
name = "sdm660"
git = "https://github.com/gs240333/UniXNU-sdm660-common.git"
commit = "71766483007f47f584e95c1e867154475753190d"
# SDM660 ArmCpu: the upstream driver arms the arch timer with INTID 27, but on
# this SoC CNTV_CTL_EL0 raises 19. The board copy takes the line from
# armcpu-timer-intid. Same source as the reference SDM660 port.
[[source]]
kind = "driver"
name = "ArmCpu"
local = "drivers/ArmCpu"